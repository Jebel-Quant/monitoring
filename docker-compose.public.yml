# Overlay for serving the board world-readable:
#
#   docker compose -f docker-compose.yml -f docker-compose.public.yml up -d
#   ./scripts/check-public-safe.sh          # must pass before you expose anything
#
# Anonymous access is turned OFF and Grafana's public-dashboard feature is
# turned ON. That combination matters more than it looks. With anonymous Viewer
# enabled, a visitor can POST arbitrary PromQL to /api/ds/query and read the raw
# label index through /api/datasources/proxy - which lists private repo names
# for hours after their data has been purged, because tombstoned index entries
# survive until head compaction. A public dashboard link serves only that one
# dashboard's own queries, with no datasource access behind it.
#
# Publish by opening the dashboard as admin -> Share -> Public dashboard.
services:
  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "true"
      # Belt and braces: no sign-up, no Explore for low-privilege roles, and the
      # snapshot feature off so nothing can be re-published elsewhere.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_EXPLORE_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
