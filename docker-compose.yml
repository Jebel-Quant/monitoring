# Optional. `docker run` is the documented way to start the board - see the
# README - and this file is the same thing with the flags written down, for
# when you would rather not retype them.
#
#   docker compose up -d --build
#
# One service: Prometheus, Grafana and the collector share a container. See the
# Dockerfile for why they are not three.

name: jq-monitoring

services:
  fleet:
    build: .
    image: ghcr.io/jebel-quant/monitoring:latest
    container_name: jq-fleet
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN, e.g. export GITHUB_TOKEN=$(gh auth token)}
      JQ_TEMPLATE_REPO: ${JQ_TEMPLATE_REPO:-Jebel-Quant/rhiza}
      JQ_GITHUB_INTERVAL: ${JQ_GITHUB_INTERVAL:-600}
      JQ_LOCAL_INTERVAL: ${JQ_LOCAL_INTERVAL:-60}
      JQ_IGNORE: ${JQ_IGNORE:-}
      JQ_PUBLIC_ONLY: ${JQ_PUBLIC_ONLY:-false}
      PROM_RETENTION: ${PROM_RETENTION:-180d}
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - ./repos.yml:/config/repos.yml:ro
      # Your home directory, whole and read-only. One mount, because repos.yml
      # names checkouts at whatever paths they actually have - see the
      # Dockerfile. Drop this line and the working-copy panels stay empty;
      # everything the GitHub half reports still works.
      - ${HOME}:/host:ro
      - fleet-data:/data
    ports:
      # Loopback only: anonymous read access is on, so a 0.0.0.0 binding would
      # serve private repo names and PR titles to the whole LAN without a
      # password. Change to "3000:3000" only if you deliberately want that.
      - "127.0.0.1:3000:3000"
      # Prometheus and the raw metrics, for when you are debugging a panel.
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9109:9109"

volumes:
  fleet-data:
