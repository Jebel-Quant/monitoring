# Prometheus and Grafana. The collector is NOT here: it runs on the host, via
# scripts/collector.sh, because it reads your working copies and a container can
# only see them through bind mounts - which cannot name a checkout that sits
# somewhere other than <root>/<owner>/<name>, and which are slow enough on
# macOS to have needed a caching layer to work around.
#
#   ./scripts/up.sh          starts both halves
#   docker compose up -d     starts only this half

name: jq-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: jq-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-180d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # Docker Desktop resolves host.docker.internal on its own; plain Docker on
    # Linux does not, and without this the collector target is simply down.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: jq-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      # A single-user board on localhost; skip the login wall but keep the
      # anonymous role read-only so a stray click cannot edit provisioning.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback only: anonymous access is enabled, so a 0.0.0.0 binding would
      # serve private repo names and PR titles to the whole LAN without a
      # password. Change to "3000:3000" only if you deliberately want that.
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
