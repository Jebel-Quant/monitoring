# Runs .pre-commit-config.yaml, so the hooks that ci.yml does not run itself -
# bandit, shellcheck, markdownlint, actionlint, betterleaks, uv-lock - gate a
# pull request instead of depending on somebody having installed them. Two of
# them sat red on main unnoticed before this existed.
#
# Its own workflow rather than a job in ci.yml, because ci.yml skips prose-only
# changes and markdownlint is the hook that most needs to see those.
name: Hooks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prek:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # uv itself, the same one ci.yml pins.
          version: "0.11.28"

      # prek pinned like every other tool here; each hook's own version is
      # pinned by its rev in .pre-commit-config.yaml.
      - name: Run every hook over every file
        run: uvx prek@0.5.4 run --all-files --show-diff-on-failure
