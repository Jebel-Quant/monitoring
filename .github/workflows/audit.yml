# Checks every package pinned in collector/uv.lock against the PyPI advisory
# database. deptry and --frozen keep the lock honest and stable; neither says
# whether anything in it is known to be vulnerable, and before this nothing did.
#
# Its own workflow rather than a job in ci.yml for the schedule: an advisory is
# usually published against a lock that has not changed, so a check that runs
# only when the lock moves would stay green on a vulnerable pin indefinitely.
name: Audit

on:
  pull_request:
    paths:
      - 'collector/uv.lock'
      - 'collector/pyproject.toml'
      - '.github/workflows/audit.yml'
  push:
    branches: [main]
    paths:
      - 'collector/uv.lock'
      - 'collector/pyproject.toml'
      - '.github/workflows/audit.yml'
  schedule:
    # Mondays, early. A red scheduled run shows on the Actions tab and mails
    # whoever last touched the workflow.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (collector/uv.lock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # uv itself, the same one ci.yml pins.
          version: "0.11.28"

      # The lock exported as hashed requirements, dev group included - ruff,
      # mypy and pytest run in CI with a token in reach, so they count too.
      # --disable-pip audits the pins as written instead of resolving them into
      # a scratch venv, and --require-hashes makes that safe: every line carries
      # the hashes uv locked. pip-audit pinned like every other tool here.
      - name: Audit the locked dependencies
        run: |
          uv export --frozen --no-emit-project \
            | uvx pip-audit@2.10.1 --disable-pip --require-hashes -r /dev/stdin
