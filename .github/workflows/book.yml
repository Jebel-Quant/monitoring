# Builds the book on every push and pull request, and publishes it to GitHub
# Pages from main only.
#
# Building on pull requests is the point: `strict: true` in mkdocs.yml turns a
# broken relative link into a failed build, and these docs were split out of one
# long README, so a stale link is the most likely way they rot. A PR that breaks
# one fails here rather than shipping a 404.
#
# The org's rhiza-managed repos use the reusable `rhiza_book.yml`, which also
# wires up coverage, test reports and marimo notebooks. This repo is not rhiza
# managed and has none of those, so it builds the site directly.
name: Book

# The mirror image of ci.yml's filter: this runs only when something the book
# is actually built from changed. The workflow file itself is listed, so a
# change to these steps is still exercised by the pull request that makes it.
#
# `**.md` is deliberately broad - it catches collector/README.md and the root
# README, neither of which is in the site, but a false positive here costs one
# cheap build while a false negative ships a broken link.
on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/book.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/book.yml'

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # uv itself, the same one ci.yml pins, so the build does not move
          # with each uv release.
          version: "0.11.28"

      # Pinned, because an unpinned theme turns an unrelated upstream release
      # into a red build on a PR that only touched the collector.
      - name: Build
        run: uvx --with mkdocs-material==9.6.14 mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _book

  deploy:
    name: deploy
    # Only from main, and never from a fork's pull request - a fork must not be
    # able to publish to this org's Pages site.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
