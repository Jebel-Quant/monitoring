# The checks that would have caught the bugs this repo has actually shipped:
# an undefined Config attribute that crashed every refresh, deleted and renamed
# workflows counted as live, and a paginated feed that hid failing jobs.
#
# CodeQL runs here too via org-level default setup, but it never executes this
# code - it passed on all three.
name: CI

# Skipped when a change touches only prose. Splitting the README into docs/
# means most doc edits are pure markdown, and running the collector tests,
# compose parsing and dashboard checks over them says nothing - it only makes
# the PR slower and trains people to ignore the checks. A mixed pull request
# still runs everything: paths-ignore skips the workflow only when *every*
# changed file matches.
#
# Note main is currently unprotected. If required status checks are ever turned
# on, a workflow skipped this way never reports and the merge button blocks
# forever - the fix then is a same-named no-op job, not removing the filter.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: read

jobs:
  collector:
    name: collector (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # uv itself, so the resolver reading the lock is the same every run.
          version: "0.11.28"

      # Every tool below comes from collector/uv.lock, ruff included, on the
      # Python in collector/.python-version. --frozen means the lock is used as
      # committed and never re-resolved, so an upstream release cannot turn an
      # unrelated pull request red; bumping a tool is a lock change, reviewed
      # like any other.
      - name: Lint
        run: uv run --frozen ruff check jq_collector tests

      - name: Format
        run: uv run --frozen ruff format --check jq_collector tests

      # Scope and target version live in [tool.mypy], so this line and a local
      # `uv run mypy` cannot check different things.
      - name: Types
        run: uv run --frozen mypy

      - name: Tests
        run: |
          uv run --frozen python -m pytest \
            --cov=jq_collector --cov-report=term-missing --cov-report=xml:_tests/coverage.xml

      # The board reads coverage from this artifact, for this repo as for every
      # other one it watches - see docs/dashboard.md#size-and-cadence. The name
      # is load-bearing: the collector looks for `coverage-report` and nothing
      # else. So is the path being repo-relative rather than collector-relative,
      # because defaults.run.working-directory applies to `run` steps only and
      # this is a `uses` step - getting that wrong uploads an empty artifact and
      # the column silently reads "no report".
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: collector/_tests/coverage.xml
          if-no-files-found: error

  # requires-python says >=3.11 while the image and the job above run 3.12, so
  # without this the declared floor is a claim nothing checks. Tests only: lint
  # and format do not depend on the interpreter, and the coverage artifact must
  # come from exactly one job - two uploads named `coverage-report` collide.
  collector-floor:
    name: collector (tests, Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # uv itself, so the resolver reading the lock is the same every run.
          version: "0.11.28"

      - name: Tests
        run: uv run --frozen --python 3.11 python -m pytest --cov=jq_collector

  dashboards:
    name: dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Panel ids, link targets and grid overlaps
        run: python3 scripts/check-dashboard.py

  image:
    name: image builds and comes up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build -t jq-monitoring:ci .

      # The entry points a user actually touches. A syntax error in either used
      # to be caught by nothing at all - and now they are the container's PID 1
      # and its only maintenance command, so a broken one is a board that does
      # not start.
      - name: Shell scripts parse
        run: for f in image/*.sh; do bash -n "$f"; done

      - name: Compose file parses
        env:
          GITHUB_TOKEN: dummy-value-for-interpolation-only
        run: docker compose -f docker-compose.yml config --quiet

      # repos.yml is gitignored, so CI writes one the way a new user would.
      # This is the whole install path in one step: a checkout that does NOT sit
      # at <root>/<owner>/<name> - the case the paths in repos.yml exist for -
      # plus a repo with no checkout at all, and the board has to come up
      # serving metrics for both. Nothing else in CI reads repos.yml, so a
      # regression here would otherwise only surface on somebody's laptop.
      - name: It comes up and serves the fleet
        run: |
          mkdir -p home/nested/somewhere
          git init -q -b main home/nested/somewhere/rhiza
          git -C home/nested/somewhere/rhiza remote add origin \
            https://github.com/Jebel-Quant/rhiza.git
          cat > repos.yml <<'YML'
          repos:
            - path: ~/nested/somewhere/rhiza
            - repo: Jebel-Quant/actions
          YML

          # No GITHUB_TOKEN on purpose: this asserts the container comes up and
          # resolves the fleet off repos.yml, which needs no network. The
          # GitHub half will fail (several endpoints 401 unauthenticated), so
          # nothing below may depend on it having answered.
          docker run -d --name fleet \
            -p 127.0.0.1:9109:9109 \
            -p 127.0.0.1:9090:9090 \
            -p 127.0.0.1:3000:3000 \
            -v "$PWD/repos.yml:/config/repos.yml:ro" \
            -v "$PWD/home:/host:ro" \
            jq-monitoring:ci

          for _ in $(seq 1 60); do
            curl -fsS http://localhost:9109/metrics -o metrics.txt && break
            docker ps -q -f name=fleet | grep -q . || { docker logs fleet; exit 1; }
            sleep 5
          done

          docker logs fleet > logs.txt 2>&1
          cat logs.txt

          # The awkward path was found: `cloned` is 1 only if the collector
          # reached the checkout through the /host mount, which is the whole
          # reason repos.yml carries paths rather than deriving them.
          grep -q 'jq_repo_cloned{repo="Jebel-Quant/rhiza"} 1.0' metrics.txt

          # Both entries parsed, one of them with no checkout. Asserted on the
          # startup line rather than on a metric: a repo with no checkout
          # reaches the board only through the GitHub half, which has no token
          # here - so `repo="Jebel-Quant/actions"` is legitimately absent from
          # /metrics and asserting on it would be testing GitHub, not this.
          grep -q 'fleet: 2 repos, 1 with a checkout' logs.txt

      # The step above only ever asked the collector. The image's other two
      # processes are what a user actually looks at, and a Grafana that starts
      # but fails to provision the board stays up - so the entrypoint's "any
      # exit takes the container down" never fires. A two-major Grafana and
      # Prometheus bump went through CI green without either being asked
      # anything; this is the step that would have asked.
      - name: Prometheus scrapes it and Grafana serves the board
        run: |
          # Polls until $1 answers 2xx, writing the body to $2. Bails out with
          # the logs as soon as the container is gone rather than waiting out
          # the clock on something that cannot come back.
          wait_for() {
            for _ in $(seq 1 60); do
              curl -fsS "$1" -o "$2" && return 0
              docker ps -q -f name=fleet | grep -q . || { docker logs fleet; return 1; }
              sleep 2
            done
            echo "timed out waiting for $1"; docker logs fleet; return 1
          }

          wait_for http://localhost:9090/-/ready /dev/null
          wait_for http://localhost:3000/api/health health.json

          # Provisioned, not just running: the dashboard by the uid every
          # link in the docs uses, with its panels, and the datasource it
          # draws from reachable through Grafana itself.
          wait_for http://localhost:3000/api/dashboards/uid/jq-fleet dashboard.json
          python3 -c "import json,sys; d=json.load(open('dashboard.json'))['dashboard']; n=len(d.get('panels') or []); print(d['title'], n, 'panels'); sys.exit(0 if n else 'the jq-fleet dashboard has no panels')"
          wait_for http://localhost:3000/api/datasources/uid/jq-prometheus/health datasource.json
          grep -q '"status":"OK"' datasource.json || { cat datasource.json; exit 1; }

          # prometheus.yml still means what it says to this Prometheus: the
          # collector is scraped. The first scrape can take one interval (30s).
          for _ in $(seq 1 40); do
            curl -fsS http://localhost:9090/api/v1/query \
              --data-urlencode 'query=up{job="jq-collector"}' -o up.json \
              && grep -q '"value":\[[0-9.]*,"1"\]' up.json && exit 0
            sleep 3
          done
          echo "Prometheus never scraped the collector"; cat up.json; docker logs fleet; exit 1

      # A refusal at startup, not a board that is quietly one repo short. This
      # is the failure mode the whole config path is shaped to avoid.
      - name: A broken repos.yml stops the container
        run: |
          printf 'repos:\n  - repo: no-slash\n' > broken.yml
          docker run --rm -v "$PWD/broken.yml:/config/repos.yml:ro" \
            jq-monitoring:ci 2>&1 | tee out.txt || true
          grep -q 'no-slash' out.txt
