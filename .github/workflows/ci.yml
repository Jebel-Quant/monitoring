# The checks that would have caught the bugs this repo has actually shipped:
# an undefined Config attribute that crashed every refresh, deleted and renamed
# workflows counted as live, and a paginated feed that hid failing jobs.
#
# CodeQL runs here too via org-level default setup, but it never executes this
# code - it passed on all three.
name: CI

# Skipped when a change touches only prose. Splitting the README into docs/
# means most doc edits are pure markdown, and running the collector tests,
# compose parsing and dashboard checks over them says nothing - it only makes
# the PR slower and trains people to ignore the checks. A mixed pull request
# still runs everything: paths-ignore skips the workflow only when *every*
# changed file matches.
#
# Note main is currently unprotected. If required status checks are ever turned
# on, a workflow skipped this way never reports and the merge button blocks
# forever - the fix then is a same-named no-op job, not removing the filter.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: read

jobs:
  collector:
    name: collector (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        run: uvx ruff check jq_collector tests

      - name: Format
        run: uvx ruff format --check jq_collector tests

      - name: Tests
        run: |
          uv run --with pytest --with pytest-cov --with prometheus-client --with httpx \
            --with pyyaml python -m pytest \
            --cov=jq_collector --cov-report=term-missing --cov-report=xml:_tests/coverage.xml

      # The board reads coverage from this artifact, for this repo as for every
      # other one it watches - see docs/dashboard.md#size-and-cadence. The name
      # is load-bearing: the collector looks for `coverage-report` and nothing
      # else. So is the path being repo-relative rather than collector-relative,
      # because defaults.run.working-directory applies to `run` steps only and
      # this is a `uses` step - getting that wrong uploads an empty artifact and
      # the column silently reads "no report".
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: collector/_tests/coverage.xml
          if-no-files-found: error

  dashboards:
    name: dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Panel ids, link targets and grid overlaps
        run: python3 scripts/check-dashboard.py

  compose:
    name: compose and scripts
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is a required variable in the compose file; any value
    # satisfies interpolation.
    env:
      GITHUB_TOKEN: dummy-value-for-interpolation-only
    steps:
      - uses: actions/checkout@v4

      - name: Compose files parse
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.admin.yml config --quiet

      # The collector runs on the host now, so these are the entry points a
      # user actually touches. A syntax error in one of them used to be caught
      # by nothing at all.
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done

      # repos.yml is gitignored, so CI builds one the way a new user would and
      # proves gen-repos.py emits the two lines the collector reads - including
      # for a checkout that does NOT sit at <root>/<owner>/<name>, which is the
      # case the paths line exists for. Nothing else in CI reads repos.yml, so
      # a malformed one would otherwise only surface on somebody's laptop.
      - name: The fleet resolves to an environment
        run: |
          pip install --quiet pyyaml
          printf 'repos:\n' > repos.yml
          git init -q -b main nested/somewhere/rhiza
          git -C nested/somewhere/rhiza remote add origin https://github.com/Jebel-Quant/rhiza.git
          printf '  - path: nested/somewhere/rhiza\n' >> repos.yml
          # A repo with no checkout: GitHub panels only, no path.
          printf '  - repo: Jebel-Quant/actions\n' >> repos.yml

          python3 scripts/gen-repos.py | tee env.out
          grep -qx 'JQ_REPOS=Jebel-Quant/rhiza,Jebel-Quant/actions' env.out
          grep -q 'JQ_REPO_PATHS=Jebel-Quant/rhiza=.*/nested/somewhere/rhiza$' env.out
          test "$(grep -c 'Jebel-Quant/actions=' env.out)" = 0
