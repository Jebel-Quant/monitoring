# The checks that would have caught the bugs this repo has actually shipped:
# an undefined Config attribute that crashed every refresh, deleted and renamed
# workflows counted as live, and a paginated feed that hid failing jobs.
#
# CodeQL runs here too via org-level default setup, but it never executes this
# code - it passed on all three.
name: CI

# Skipped when a change touches only prose. Splitting the README into docs/
# means most doc edits are pure markdown, and running the collector tests,
# compose parsing and dashboard checks over them says nothing - it only makes
# the PR slower and trains people to ignore the checks. A mixed pull request
# still runs everything: paths-ignore skips the workflow only when *every*
# changed file matches.
#
# Note main is currently unprotected. If required status checks are ever turned
# on, a workflow skipped this way never reports and the merge button blocks
# forever - the fix then is a same-named no-op job, not removing the filter.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: read

jobs:
  collector:
    name: collector (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        run: uvx ruff check jq_collector tests

      - name: Format
        run: uvx ruff format --check jq_collector tests

      - name: Tests
        run: |
          uv run --with pytest --with pytest-cov --with prometheus-client --with httpx \
            --with pyyaml python -m pytest \
            --cov=jq_collector --cov-report=term-missing --cov-report=xml:_tests/coverage.xml

      # The board reads coverage from this artifact, for this repo as for every
      # other one it watches - see docs/dashboard.md#size-and-cadence. The name
      # is load-bearing: the collector looks for `coverage-report` and nothing
      # else. So is the path being repo-relative rather than collector-relative,
      # because defaults.run.working-directory applies to `run` steps only and
      # this is a `uses` step - getting that wrong uploads an empty artifact and
      # the column silently reads "no report".
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: collector/_tests/coverage.xml
          if-no-files-found: error

  dashboards:
    name: dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Panel ids, link targets and grid overlaps
        run: python3 scripts/check-dashboard.py

  image:
    name: image builds and comes up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t jq-monitoring:ci .

      # The entry points a user actually touches. A syntax error in either used
      # to be caught by nothing at all - and now they are the container's PID 1
      # and its only maintenance command, so a broken one is a board that does
      # not start.
      - name: Shell scripts parse
        run: for f in image/*.sh; do bash -n "$f"; done

      - name: Compose file parses
        env:
          GITHUB_TOKEN: dummy-value-for-interpolation-only
        run: docker compose -f docker-compose.yml config --quiet

      # repos.yml is gitignored, so CI writes one the way a new user would.
      # This is the whole install path in one step: a checkout that does NOT sit
      # at <root>/<owner>/<name> - the case the paths in repos.yml exist for -
      # plus a repo with no checkout at all, and the board has to come up
      # serving metrics for both. Nothing else in CI reads repos.yml, so a
      # regression here would otherwise only surface on somebody's laptop.
      - name: It comes up and serves the fleet
        run: |
          mkdir -p home/nested/somewhere
          git init -q -b main home/nested/somewhere/rhiza
          git -C home/nested/somewhere/rhiza remote add origin \
            https://github.com/Jebel-Quant/rhiza.git
          cat > repos.yml <<'YML'
          repos:
            - path: ~/nested/somewhere/rhiza
            - repo: Jebel-Quant/actions
          YML

          # No GITHUB_TOKEN: the GitHub half is then rate-limited to 60 calls an
          # hour and will mostly fail, which is fine - this asserts the fleet
          # resolved and the exporter is serving, not that GitHub answered.
          docker run -d --name fleet \
            -p 127.0.0.1:9109:9109 \
            -v "$PWD/repos.yml:/config/repos.yml:ro" \
            -v "$PWD/home:/host:ro" \
            jq-monitoring:ci

          for _ in $(seq 1 60); do
            curl -fsS http://localhost:9109/metrics -o metrics.txt && break
            docker ps -q -f name=fleet | grep -q . || { docker logs fleet; exit 1; }
            sleep 5
          done

          docker logs fleet
          # Both repos on the board, and the awkward path found: `cloned` is 1
          # only if the collector reached the checkout through the /host mount.
          grep -q 'jq_repo_cloned{repo="Jebel-Quant/rhiza"} 1.0' metrics.txt
          grep -q 'repo="Jebel-Quant/actions"' metrics.txt

      # A refusal at startup, not a board that is quietly one repo short. This
      # is the failure mode the whole config path is shaped to avoid.
      - name: A broken repos.yml stops the container
        run: |
          printf 'repos:\n  - repo: no-slash\n' > broken.yml
          docker run --rm -v "$PWD/broken.yml:/config/repos.yml:ro" \
            jq-monitoring:ci 2>&1 | tee out.txt || true
          grep -q 'no-slash' out.txt
