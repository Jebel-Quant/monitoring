# The collector serves a cached snapshot, so scraping it is cheap and fast even
# though the underlying GitHub refresh runs every five minutes. Scraping more
# often than the refresh just gives the graphs a finer time resolution.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    fleet: jebel-quant

scrape_configs:
  - job_name: jq-collector
    # Same container, so this is a loopback scrape. It used to be
    # host.docker.internal: the collector ran on your machine because it reads
    # your working copies and a per-repo bind mount could not name a checkout
    # at an arbitrary path. One whole-home mount can, so it moved back in.
    static_configs:
      - targets: ["localhost:9109"]
    relabel_configs:
      # There is exactly one collector, so `instance` carries no information -
      # only where the process happened to be running. Left alone it is the
      # scrape address, and moving the collector (container -> host, or back)
      # silently forks every series in two: the board then joins a repo against
      # itself and shows each one twice until the old series go stale. Pin it,
      # and the history stays continuous across the move.
      - target_label: instance
        replacement: jq-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
