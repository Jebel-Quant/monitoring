# The fleet. Copy to repos.yml and edit - repos.yml is gitignored, because the
# folder layout of your machine is nobody else's business.
#
# This is the only file you own. It is mounted into the container at
# /config/repos.yml and read at startup; nothing is generated from it, so there
# is no second file to fall out of step.
#
# A repo appears on the board because it is listed here - by its own path, or
# by a folder you keep it in - and for no other reason.

repos:
  # The usual entry: a path to a checkout, written the way you would write it
  # on your own machine. `~` is your home directory, which the container sees
  # as a single read-only mount, and owner/name is read from the checkout's
  # origin remote.
  - path: ~/repos/jebel-quant/monitoring
  - path: ~/repos/jebel-quant/rhiza

  # A whole folder: every checkout sitting directly inside it is on the board,
  # so an org you keep complete is one line instead of twenty, and the twenty
  # cannot drift out of step with what is actually on disk. Clone a repo into
  # the folder and it joins at the next restart.
  #
  # Only the folder's own children are looked at, never their children in turn
  # - name the folder the checkouts are directly in. A directory that is not a
  # checkout is passed over, and so is a clone with no origin remote to name it
  # by; a folder that is missing, or that holds no checkouts at all, refuses to
  # start, because you asked for the repos in it and there are none.
  # - folder: ~/repos/cvxgrp

  # Only some of a large shared org is yours, so name those repos one by one.
  - path: ~/repos/cvxgrp/cvxsimulator

  # Override the origin when the checkout is a fork and you want the board to
  # follow upstream rather than your copy.
  # - path: ~/repos/forks/cvxpy
  #   repo: cvxpy/cvxpy

  # This works inside a listed folder too: a folder leaves out any checkout
  # another entry names by `path`, so the two lines below put every repo in
  # ~/repos/forks on the board with cvxpy following upstream.
  # - folder: ~/repos/forks
  # - path: ~/repos/forks/cvxpy
  #   repo: cvxpy/cvxpy

  # A repo with no checkout on this machine. GitHub panels (CI, pull requests,
  # template drift, coverage) are gathered; the working-copy panels stay empty
  # for it. This is also the form to use for every entry if you would rather
  # not mount your home directory at all.
  # - repo: Jebel-Quant/actions

  # A GitLab project. `forge: gitlab` is what sends it to GitLab's API instead
  # of GitHub's; without it the entry is read as a GitHub repo and every remote
  # panel comes back empty.
  #
  # It can be left off when the entry has a `path`, because then the checkout's
  # origin host says which forge it is. Spelling it out costs nothing and is the
  # only option for an entry with no checkout.
  # - repo: acme/web
  #   forge: gitlab

  # GitLab namespaces nest, and the whole path is the project's name - not just
  # the last two segments. This is the project `web` in `acme/platform/infra`.
  # - repo: acme/platform/infra/web
  #   forge: gitlab

  # A GitLab checkout, where the forge follows from the origin remote's host.
  # - path: ~/repos/acme/web

  # A whole folder on GitLab. Stating the forge once covers every checkout the
  # folder turns up, though with a checkout to read the origin off it is not
  # needed at all.
  # - folder: ~/repos/acme
  #   forge: gitlab

  # Two notes on a mixed fleet:
  #
  # - Set GITLAB_TOKEN as well as GITHUB_TOKEN. Public projects are readable
  #   without one, private ones are not.
  # - The Dependabot tiles stay blank for GitLab repos. GitLab's equivalent is
  #   an Ultimate-tier feature, so there is nothing to read; the board shows
  #   them as unknown rather than as a green "no alerts".
