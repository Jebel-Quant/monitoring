[project]
name = "jq-collector"
version = "0.1.0"
description = "Prometheus exporter for the state of the Jebel-Quant repo fleet"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jq_collector"]
