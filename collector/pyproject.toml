[project]
name = "jq-collector"
version = "0.1.0"
description = "Prometheus exporter for the state of the Jebel-Quant repo fleet"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jq_collector"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ imports conftest helpers directly, so it needs to be on sys.path.
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
# Kept here rather than passed as a flag, so `check` and `format` cannot
# disagree - a --line-length on one and not the other silently fails CI.
line-length = 100
