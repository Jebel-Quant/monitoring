[project]
name = "jq-collector"
version = "0.1.0"
description = "Prometheus exporter for the state of the Jebel-Quant repo fleet"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jq_collector"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16", "mypy>=1.10", "types-PyYAML>=6.0", "types-defusedxml>=0.7"]

[tool.pytest.ini_options]
# The package too, for its doctests: an example in a docstring is a claim,
# and --doctest-modules is what keeps the claims true.
testpaths = ["tests", "jq_collector"]
# tests/ imports conftest helpers directly, so it needs to be on sys.path.
pythonpath = ["tests"]
addopts = "-q --doctest-modules"

[tool.coverage.run]
# The package, not the tests - measuring the tests inflates the figure with
# lines that are by definition executed. This is the denominator the board's
# Coverage column reports against, and it is deliberately narrower than
# jq_local_code_lines, which counts every tracked source file in the repo.
source = ["jq_collector"]
# Both arms of every branch, not just every line: an `if` whose false side
# never runs is 100% line-covered and still untested. fail_under below then
# holds lines and branches to the same floor.
branch = true

[tool.coverage.report]
# The package is fully covered; this keeps it that way. pytest-cov reads it, so
# CI's test step fails on a drop without a --cov-fail-under of its own.
fail_under = 100

[tool.mypy]
# The package only, checked against the oldest Python it claims to run on, and
# strict: every signature typed, every generic parameterised. JSON payloads are
# dict[str, Any] - the forge decides their shape, so Any is the honest type
# there rather than a gap. CI's Types step reads this, so it enforces it too.
files = ["jq_collector"]
python_version = "3.11"
strict = true

[tool.ruff]
# Kept here rather than passed as a flag, so `check` and `format` cannot
# disagree - a --line-length on one and not the other silently fails CI.
line-length = 100
