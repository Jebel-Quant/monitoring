apiVersion: 1

providers:
  - name: jebel-quant
    orgId: 1
    folder: Jebel-Quant
    type: file
    disableDeletion: false
    # Provisioned dashboards are read-only in the UI; edit the JSON in git and
    # Grafana picks it up within this interval.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      # Beside the rest of the provisioning, not under /var/lib/grafana: that
      # is GF_PATHS_DATA, which the image points at the /data volume, and a
      # dashboard shipped in the image must not depend on a mount to exist.
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
