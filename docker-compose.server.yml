# Standalone stack for an always-on host, serving the board world-readable.
#
#   GITHUB_TOKEN=... docker compose -f docker-compose.server.yml up -d
#
# Not an overlay - use this INSTEAD of docker-compose.yml. It differs from the
# laptop stack in four ways that all follow from "no working copies here, and
# strangers can reach it":
#
#   * no bind mount and JQ_REPO_ROOT empty, so local scanning is skipped
#     entirely rather than erroring once a minute. There is no repos.yml here
#     either: with no checkouts to point at, the fleet is named directly in
#     JQ_REPOS as a comma-separated list of owner/name.
#   * JQ_PUBLIC_ONLY is forced on, so private repos are never gathered at all
#   * only Grafana publishes a port; Prometheus and the collector talk over the
#     compose network and are unreachable from outside
#   * anonymous access off, public dashboards on - a public link serves that one
#     dashboard's queries with no datasource behind it, where an open Grafana
#     would let any visitor run arbitrary PromQL
#
# Run ./scripts/check-public-safe.sh against it before sharing the link.

name: jq-monitoring

services:
  collector:
    build: ./collector
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in the environment or a .env file}
      # The fleet, as owner/name. Explicit here as on a laptop - the only
      # difference is that a server has no checkouts to derive it from.
      JQ_REPOS: ${JQ_REPOS:?set JQ_REPOS to a comma-separated list of owner/name}
      JQ_TEMPLATE_REPO: ${JQ_TEMPLATE_REPO:-Jebel-Quant/rhiza}
      JQ_GITHUB_INTERVAL: ${JQ_GITHUB_INTERVAL:-300}
      # No clones on a server. Empty means "skip local scanning".
      JQ_REPO_ROOT: ""
      # Not overridable: this stack exists to be public.
      JQ_PUBLIC_ONLY: "true"
      JQ_LOG_LEVEL: ${JQ_LOG_LEVEL:-INFO}
    expose:
      - "9109"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-180d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    depends_on:
      - collector

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set a real admin password - this host is reachable}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_EXPLORE_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GF_BIND:-0.0.0.0}:${GF_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
